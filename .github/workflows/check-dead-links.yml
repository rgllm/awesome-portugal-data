name: Check Dead Links

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check links in README
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: '--verbose --no-progress README.md'
          fail: false

      - name: Find existing dead-links issue
        id: find-issue
        if: steps.lychee.outputs.exit_code != 0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          issue_number=$(gh issue list --state open --json number,title \
            --jq '.[] | select(.title == "Dead links found in README") | .number' | head -n 1)
          echo "issue-number=$issue_number" >> "$GITHUB_OUTPUT"

      - name: Create or update dead-links issue
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Dead links found in README
          content-filepath: ./lychee/out.md
          issue-number: ${{ steps.find-issue.outputs.issue-number }}
          labels: bug